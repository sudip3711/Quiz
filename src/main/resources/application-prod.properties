# ===== DATABASE CONFIG (Using Railway ENV Variables) =====
spring.datasource.url=jdbc:mysql://mysql.railway.internal:3306/railway
spring.datasource.username=root
spring.datasource.password=eQgMNnPFvqfTsaCJJkgNqZXmVGBThnzt
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== HIKARI CONNECTION POOL (Optimized for Railway) =====
spring.datasource.hikari.connection-timeout=10000  # 10s timeout
spring.datasource.hikari.maximum-pool-size=10      # Lower for Railway stability
spring.datasource.hikari.idle-timeout=30000        # 30s idle timeout
spring.datasource.hikari.max-lifetime=60000        # 1m max lifetime

# ===== JPA/HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== DISABLE JTA (Atomikos not needed for MySQL) =====
spring.jta.enabled=false

# ===== LOGGING (Debug if issues persist) =====
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN